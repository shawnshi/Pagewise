// Tauri 2.11.5 uses a pinned project-local lifecycle overlay; no Cargo cache files are written.
// Other plugin sources/resources remain in their original, read-only Cargo locations.
['tauri-android', 'tauri-plugin-dialog', 'tauri-plugin-fs', 'tauri-plugin-opener'].each { name ->
    def module = findProject(':' + name)
    if (module == null) throw new GradleException('Missing expected native module: ' + name)
    if (name == 'tauri-android') {
        def overlay = new File(settingsDir, 'native-sdk/tauri-android')
        if (!new File(overlay, 'pagewise-provenance.json').isFile()) throw new GradleException('Missing pinned Tauri lifecycle overlay')
        module.projectDir = overlay
    } else if (module.projectDir.toPath().getRoot() != settingsDir.toPath().getRoot()) {
        def overlay = new File(settingsDir, 'native-sdk/' + name)
        if (!overlay.exists()) {
            copy {
                from module.projectDir
                into overlay
            }
        }
        module.projectDir = overlay
    }
    def adapter = new File(settingsDir, 'native-gradle/' + name + '.gradle.kts')
    if (!adapter.isFile()) throw new GradleException('Missing project-local Kotlin adapter: ' + name)
    module.buildFileName = module.projectDir.toPath().relativize(adapter.toPath()).toString()
}
