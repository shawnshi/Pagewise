<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知页 · Pagewise 图标预览</title>
<style>
:root{color-scheme:light;--icon-size:28px}*{box-sizing:border-box}body{margin:0;color:#000;background:#fff;font-family:"Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:36px 24px 60px}h1{font-size:26px;margin:0 0 8px}p{line-height:1.8}.controls{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0}button{font:inherit;color:inherit;background:#fff;border:1px solid #aaa;border-radius:6px;min-height:48px;padding:8px 16px;cursor:pointer}button:focus-visible{outline:3px solid #000;outline-offset:3px}button[aria-pressed=true]{border:2px solid #000;font-weight:700}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.tile{position:relative;min-height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}.tile svg{width:var(--icon-size);height:var(--icon-size);display:block}.tile[aria-pressed=true]:after{content:"";width:24px;height:3px;position:absolute;bottom:10px;background:#000}.small{font-size:13px}.nav{display:flex;gap:12px;border-top:2px solid #000;padding-top:20px;margin:30px 0}.nav button{flex:1}.hint{border-left:3px solid #000;padding:10px 18px;min-height:80px}.reader{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:680px}.reader button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:88px}.reader svg{width:28px;height:28px}.reader button[aria-pressed=true]{border:2px solid #000}@media(max-width:640px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.reader{font-size:14px}.reader button{padding:6px 2px}main{padding:24px 16px}}
</style><main><h1>知页 · Pagewise / 菜单图标</h1><p>14个基础图标 · 黑白矢量 · 点击切换强调状态</p><div class="controls"><button class="size" data-size="24" aria-pressed="false">24 px</button><button class="size" data-size="28" aria-pressed="true">28 px</button><button class="size" data-size="32" aria-pressed="false">32 px</button><button id="clear">清除选中</button></div><div class="grid" id="grid"></div><p class="hint" id="hint">图标保留文字标签。选中同时改变边框、文字和指示线。</p><h2>阅读工具排列</h2><p>视觉与命名示例，点击仅展示用途说明，不执行书籍操作。</p><div class="reader" id="reader"></div><p class="small">本页离线可用。字形由当前系统中文字体显示；图标图形不依赖字体。</p></main>
<script>
const icons=[{"id": "library", "recommended_label": "书库", "group": "主导航", "purpose": "全部书籍和书单入口，外部书目与本地文件以状态区分。", "markup": "<rect x=\"3\" y=\"5\" width=\"4\" height=\"15\" rx=\".8\"/><rect x=\"9\" y=\"3\" width=\"4\" height=\"17\" rx=\".8\"/><path d=\"M16 5.8l3.8-.7L22 19.2l-3.8.7Z\"/><path d=\"M3 16h4M9 16h4\"/>"}, {"id": "currently-reading", "recommended_label": "在读", "group": "主导航", "purpose": "正在阅读的书和继续阅读入口；按钮文案使用“继续阅读”。", "markup": "<path d=\"M12 6C9 3.9 5.7 4 2.8 5.1v15C6.1 18.7 9.1 18.9 12 20.6c2.9-1.7 5.9-1.9 9.2-.5v-15C18.3 4 15 3.9 12 6Z\"/><path d=\"M12 6v14.6\"/>"}, {"id": "notes", "recommended_label": "笔记", "group": "主导航", "purpose": "跨书汇总笔记；可按书籍、标签或时间筛选。", "markup": "<rect x=\"5\" y=\"3\" width=\"15\" height=\"18\" rx=\"1.5\"/><path d=\"M9 3v18M3 7h4M3 12h4M3 17h4M12 8h5M12 12h5M12 16h3\"/>"}, {"id": "reading-history", "recommended_label": "阅读记录", "group": "次级入口", "purpose": "阅读时段、完成历史和阅读统计；若只展示最近打开清单，则命名“最近阅读”。", "markup": "<path d=\"M3.3 9.2a9 9 0 1 1 1.5 8.9\"/><path d=\"M3.3 4.6v4.6h4.6M12 7v5l3.1 2\"/>"}, {"id": "settings", "recommended_label": "设置", "group": "次级入口", "purpose": "账号、数据、设备及全局默认值；本书排版留在阅读器内。", "markup": "<path d=\"M8.844 5.529L10.046 2.805L13.954 2.805L15.156 5.529L16.026 6.031L18.986 5.710L20.940 9.095L19.182 11.498L19.182 12.502L20.940 14.905L18.986 18.290L16.026 17.969L15.156 18.471L13.954 21.195L10.046 21.195L8.844 18.471L7.974 17.969L5.014 18.290L3.060 14.905L4.818 12.502L4.818 11.498L3.060 9.095L5.014 5.710L7.974 6.031Z\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/>"}, {"id": "table-of-contents", "recommended_label": "目录", "group": "阅读工具", "purpose": "本书章节结构与定位；面板可展示二级、三级标题。", "markup": "<circle cx=\"3.5\" cy=\"6\" r=\"1\" fill=\"currentColor\" stroke=\"none\"/><circle cx=\"3.5\" cy=\"12\" r=\"1\" fill=\"currentColor\" stroke=\"none\"/><circle cx=\"3.5\" cy=\"18\" r=\"1\" fill=\"currentColor\" stroke=\"none\"/><path d=\"M7.5 6H21M7.5 12H21M7.5 18h10\"/>"}, {"id": "annotations", "recommended_label": "批注", "group": "阅读工具", "purpose": "本书的划线和附着原文的想法；面板内使用“划线”“想法”筛选。", "markup": "<path d=\"M14.5 2.8l6.3 6.3-7.2 7.2-6.3-6.3Z\"/><path d=\"M7.3 10l-2.8 6 3 3 6.1-2.7M12.2 5.1l6.3 6.3M3 21h18\"/>"}, {"id": "bookmarks", "recommended_label": "书签", "group": "阅读工具", "purpose": "菜单打开本书书签列表；当前页添加与移除书签是独立动作。", "markup": "<path d=\"M7 3h10a1 1 0 0 1 1 1v17l-6-4-6 4V4a1 1 0 0 1 1-1Z\"/>"}, {"id": "read-aloud", "recommended_label": "朗读", "group": "阅读工具", "purpose": "当前电子书的文字转语音。以后接入专业有声书时，可单独设置“听书”。", "markup": "<path d=\"M3.5 13v-2a8.5 8.5 0 0 1 17 0v2\"/><rect x=\"3\" y=\"12\" width=\"4\" height=\"8\" rx=\"1.2\"/><rect x=\"17\" y=\"12\" width=\"4\" height=\"8\" rx=\"1.2\"/><path d=\"M10 12h4M10 16h3\"/>"}, {"id": "reading-assistant", "recommended_label": "阅读助手", "group": "阅读工具", "purpose": "解释、问答、总结与内容分析；面板标题可标明“阅读助手 · AI”。", "markup": "<path d=\"M12 4H6a3 3 0 0 0-3 3v9a3 3 0 0 0 3 3h1v3l4-3h7a3 3 0 0 0 3-3v-4\"/><path d=\"M7 11h5M7 15h7\"/><path d=\"M18.5 2.5l1.3 2.7 2.7 1.3-2.7 1.3-1.3 2.7-1.3-2.7-2.7-1.3 2.7-1.3Z\" fill=\"currentColor\" stroke=\"none\"/>"}, {"id": "search-in-book", "recommended_label": "书内搜索", "group": "阅读工具", "purpose": "按阅读场景理解原名称，搜索当前书全文；书库搜书另用search-library。", "markup": "<path d=\"M14 3H4v18h6M14 3l5 5h-5ZM19 8v.5M7 7h3M7 11h2\"/><circle cx=\"15\" cy=\"14\" r=\"4.2\"/><path d=\"M18.1 17.1l3.4 3.4\"/>"}, {"id": "reading-modes", "recommended_label": "阅读模式", "group": "阅读工具", "purpose": "翻页、滚动、单双栏和专注等阅读方式；工具栏短标签为“模式”。", "markup": "<rect x=\"3\" y=\"4\" width=\"18\" height=\"16\" rx=\"1.5\"/><path d=\"M12 4v16M6 8h3M6 12h3M15 8h3M15 12h3\"/>"}, {"id": "typography", "recommended_label": "排版", "group": "阅读工具", "purpose": "字体、字号、字重、行段距、字距、边距与对齐；面板标题为“排版设置”。", "markup": "<path d=\"M3 20 8 4l5 16M4.9 14h6.2M16 6h5M16 12h5M16 18h3\"/>"}, {"id": "search-library", "recommended_label": "搜索书籍", "group": "上下文入口", "purpose": "书库全局搜书，可切换书名、作者、标签；若原“书类搜索”指此场景，使用本项。", "markup": "<circle cx=\"10.5\" cy=\"10.5\" r=\"6.5\"/><path d=\"M15.3 15.3 21 21\"/>"}];
const draw=(i,on=false)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${on?2.25:2}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${i.markup}</svg>`;
function make(i,reader=false){const b=document.createElement('button');b.className=reader?'':'tile';b.type='button';b.setAttribute('aria-pressed','false');b.setAttribute('aria-label',i.recommended_label);b.innerHTML=draw(i)+`<span>${reader&&i.id==='reading-modes'?'模式':i.recommended_label}</span>`;b.onclick=()=>{const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',String(on));b.querySelector('svg').setAttribute('stroke-width',on?'2.25':'2');document.getElementById('hint').textContent=i.recommended_label+'：'+i.purpose;};return b;}
icons.forEach(i=>document.getElementById('grid').append(make(i)));
['table-of-contents','search-in-book','annotations','bookmarks','read-aloud','reading-assistant','reading-modes','typography'].forEach(id=>document.getElementById('reader').append(make(icons.find(i=>i.id===id),true)));
document.querySelectorAll('.size').forEach(b=>b.onclick=()=>{document.documentElement.style.setProperty('--icon-size',b.dataset.size+'px');document.querySelectorAll('.size').forEach(s=>s.setAttribute('aria-pressed',String(s===b)));});
document.getElementById('clear').onclick=()=>{document.querySelectorAll('.tile,.reader button').forEach(b=>{b.setAttribute('aria-pressed','false');b.querySelector('svg').setAttribute('stroke-width','2');});};
</script></html>
